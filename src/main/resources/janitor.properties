janitor.fields.scanFailed.title=The last scan failed
janitor.fields.scanFailed.at=Failed at:
janitor.fields.scanFailed.stale=The table below is from an EARLIER scan, not the failed one. Do not treat it as current.

# Scan failure (v1.0.1)
janitor.help.scan.failed.title=When a scan fails
janitor.help.scan.failed.body=If a material that feeds the label directly cannot be read, no partial result is produced - the whole scan fails. Value counting and the locked-field lookup are such materials. The reason is that their failure does not blank the label, it inverts it: an unreadable value count stays 0, which reads as [Unused], meaning safe to delete, and sorts to the top of the list. When a scan fails the previous result stays in place and a red failure notice appears above the table. That notice survives a refresh, and if the table is from an earlier scan it says so.

# Session expiry / lost permission (v1.0.2). Do not fail silently on the client either.
janitor.fields.sessionExpired=Your administrator session has expired or you no longer have permission. Refresh the page and try again.
janitor.fields.scanRequestFailed=The scan request failed. Try again shortly, or check the logs.
# Degraded field list (v1.0.2)
janitor.fields.degraded.title=The field list is incomplete
janitor.fields.degraded.body=The customfield table could not be read, so the table was built from the Jira API list alone. The Jira API omits fields whose type-providing app is disabled, which means the strongest cleanup candidates may be missing from the table below. Run another scan before choosing anything to delete.
