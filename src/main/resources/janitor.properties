janitor.fields.page.title=Custom field usage
janitor.fields.page.intro=For each custom field this page shows how many issues hold a value, and every screen, field configuration, workflow, filter, scheme and dashboard gadget that references it. Nothing is deleted here - each item links to the standard Jira administration screen.

janitor.fields.limitation=Not included: Agile board configuration (card layout, quick filters, estimation field, swimlanes) and settings stored by third-party apps in their own tables. "No references" here does not prove a field is safe to delete.
janitor.fields.metric.note=Issues with value counts distinct issues. Value rows counts stored rows - a multi-value field stores several rows for one issue, so the two numbers differ. Counts come from the customfieldvalue and label tables. A field type that keeps its data in its own app tables (Rank, and some third-party types) still shows 0.

