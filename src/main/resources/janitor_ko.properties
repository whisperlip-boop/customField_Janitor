janitor.help.status.cond.unused=\uac12 0 \u00b7 \ud654\uba74 0 \u00b7 \uc0ac\uc6a9 \uc99d\uac70 \ucc38\uc870 0
janitor.help.status.desc.unused=\uac12\uc774 \ub4e4\uc5b4 \uc788\ub294 \uc774\uc288\uac00 \uc5c6\uace0, \uc5b4\ub5a4 \ud654\uba74\u00b7\uc6cc\ud06c\ud50c\ub85c\u00b7\ud544\ud130\u00b7\uac00\uc82f\u00b7\uc2a4\ud0b4\uc5d0\uc11c\ub3c4 \ucc38\uc870\ub418\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4. \uc774 \ub3c4\uad6c\uac00 \ud655\uc778\ud560 \uc218 \uc788\ub294 \ubc94\uc704\uc5d0\uc11c\ub294 \uc544\ubb34\ub3c4 \uc4f0\uc9c0 \uc54a\ub294 \ud544\ub4dc\uc785\ub2c8\ub2e4.
janitor.help.status.act.unused=\uccad\uc18c 1\ucc28 \ub300\uc0c1\uc785\ub2c8\ub2e4. \ub2e4\ub9cc 7\uc7a5\uc758 \ud55c\uacc4\ub97c \uba3c\uc800 \uc77d\uc73c\uc2ed\uc2dc\uc624 \u2014 Agile \ubcf4\ub4dc \uc124\uc815\uc774\ub098 \uc11c\ub4dc\ud30c\ud2f0 \uc571 \uc124\uc815\uc740 \uc774 \ub3c4\uad6c\uac00 \ubcf4\uc9c0 \ubabb\ud569\ub2c8\ub2e4.

janitor.help.status.cond.abandoned=\uac12 0 \u00b7 (\ud654\uba74 \ub610\ub294 \ud544\ud130\u00b7\uac00\uc82f \ucc38\uc870 \uc788\uc74c)
janitor.help.status.desc.abandoned=\ud654\uba74\uc774\ub098 \uc124\uc815\uc5d0\ub294 \uac78\ub824 \uc788\ub294\ub370 \uc544\ubb34\ub3c4 \uac12\uc744 \uc785\ub825\ud55c \uc801\uc774 \uc5c6\uc2b5\ub2c8\ub2e4. \ud654\uba74\uc5d0 \uc788\ub294\ub370\ub3c4 \uac12\uc774 0\uc774\uba74 \uc0ac\uc6a9\uc790\uac00 \uadf8 \ud544\ub4dc\ub97c \ubb34\uc2dc\ud558\uace0 \uc788\ub2e4\ub294 \ub73b\uc785\ub2c8\ub2e4. \ud654\uba74 \ucc38\uc870\ub294 \uc5c6\uc9c0\ub9cc \ud544\ud130\ub098 \uac00\uc82f\uc5d0\uc11c\ub9cc \uc4f0\uc774\ub294 \uacbd\uc6b0\ub3c4 \uc5ec\uae30\uc5d0 \ub4e4\uc5b4\uac11\ub2c8\ub2e4 \u2014 \uc544\ubb34\ub3c4 \uc785\ub825\ud560 \uc218 \uc5c6\ub294\ub370 \uc9c0\uc6b0\uba74 \ud544\ud130\uac00 \uae68\uc9c0\ub294 \uc0c1\ud0dc\uc785\ub2c8\ub2e4.
janitor.help.status.act.abandoned=\ubc14\ub85c \uc9c0\uc6b0\uae30\ubcf4\ub2e4 \uba3c\uc800 \ud654\uba74\uc5d0\uc11c \uc81c\uac70\ud558\uc2ed\uc2dc\uc624. \ud654\uba74\uc5d0\uc11c \ube7c\ub3c4 \uac12\uc774 \uc5c6\uc73c\ub2c8 \uc783\uc744 \uac83\uc774 \uc5c6\uace0, \ud55c\ub3d9\uc548 \uc544\ubb34 \ubb38\uc758\uac00 \uc5c6\uc73c\uba74 \uadf8\ub54c \uc0ad\uc81c\ud558\uba74 \ub429\ub2c8\ub2e4. \ud544\ud130 \ucc38\uc870\uac00 \uc788\uc73c\uba74 \uadf8 \ud544\ud130\ub97c \uba3c\uc800 \uc815\ub9ac\ud558\uc2ed\uc2dc\uc624.

janitor.help.status.cond.orphan-data=\uac12 > 0 \u00b7 \ud654\uba74 0
janitor.help.status.desc.orphan-data=\uc774\uc288\uc5d0 \uac12\uc774 \ub4e4\uc5b4 \uc788\ub294\ub370 \uc774 \ud544\ub4dc\uac00 \ub193\uc778 \ud654\uba74\uc774 \ud558\ub098\ub3c4 \uc5c6\uc2b5\ub2c8\ub2e4. \uc608\uc804\uc5d0\ub294 \ud654\uba74\uc5d0 \uc788\uc5b4\uc11c \ub370\uc774\ud130\uac00 \uc313\uc600\uace0 \uadf8 \ub4a4 \ud654\uba74\uc5d0\uc11c \ube60\uc9c4 \uc0c1\ud0dc\uc785\ub2c8\ub2e4. \uc774\uc288\ub97c \uc5f4\uc5b4\ub3c4 \uc774 \ud544\ub4dc\uac00 \ubcf4\uc774\uc9c0 \uc54a\uc73c\ub2c8 \uc0ac\ub78c \ub208\uc5d0\ub294 \uc5c6\ub294 \ud544\ub4dc\ucc98\ub7fc \ubcf4\uc774\uc9c0\ub9cc \ub370\uc774\ud130\ub294 \ub0a8\uc544 \uc788\uc2b5\ub2c8\ub2e4. Jira \uae30\ubcf8 \uad00\ub9ac \ud654\uba74\uc5d0\uc11c\ub294 "\ud654\uba74 0\uac1c"\ub85c\ub9cc \ubcf4\uc5ec\uc11c \uc548 \uc4f0\ub294 \ud544\ub4dc\ub85c \uc624\ud574\ud558\uae30 \uac00\uc7a5 \uc26c\uc6b4 \uc0c1\ud0dc\uc785\ub2c8\ub2e4.
janitor.help.status.act.orphan-data=\uc9c0\uc6b0\uba74 \uadf8 \uac12\uc774 \uc601\uad6c\ud788 \uc0ac\ub77c\uc9d1\ub2c8\ub2e4. \ub370\uc774\ud130\uac00 \uc544\uc9c1 \ud544\uc694\ud55c\uc9c0 \uba3c\uc800 \ud655\uc778\ud558\uc2ed\uc2dc\uc624. \ud544\uc694\ud558\uba74 \ud654\uba74\uc5d0 \ub2e4\uc2dc \uc62c\ub9ac\uace0, \ud544\uc694 \uc5c6\uc73c\uba74 CSV\ub098 JQL\ub85c \uba3c\uc800 \ubf51\uc544 \ub450\uace0 \uc9c0\uc6b0\uc2ed\uc2dc\uc624.

