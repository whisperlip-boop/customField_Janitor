janitor.help.status.cond.at-risk=\uc571\uc774 \uc7a0\uac14\uac70\ub098 \u00b7 \uc6cc\ud06c\ud50c\ub85c\u00b7\uad8c\ud55c\u00b7\uc54c\ub9bc\u00b7\uc774\uc288 \ubcf4\uc548 \uc2a4\ud0b4\uc774 \ucc38\uc870
janitor.help.status.desc.at-risk=\uac12\uacfc \ud654\uba74 \uc0c1\ud0dc\uc5d0 \uad00\uacc4\uc5c6\uc774 \uac00\uc7a5 \uba3c\uc800 \ubd99\ub294 \ub77c\ubca8\uc785\ub2c8\ub2e4. \uc774 \ucc38\uc870\ub4e4\uc740 \uc9c0\uc6e0\uc744 \ub54c \ud654\uba74\uc774 \uc544\ub2c8\ub77c \ub3d9\uc791\uc774 \uae68\uc9c0\uace0, \uadf8 \uae68\uc9d0\uc774 \uc870\uc6a9\ud569\ub2c8\ub2e4. \uad8c\ud55c \uc2a4\ud0b4\uc5d0\uc11c \ud544\ub4dc\uac00 \uc0ac\ub77c\uc9c0\uba74 \uc624\ub958\uac00 \ub098\ub294 \ub300\uc2e0 \uadf8 \ud56d\ubaa9\uc774 \uc544\ubb34\uc5d0\uac8c\ub3c4 \uad8c\ud55c\uc744 \uc8fc\uc9c0 \uc54a\uac8c \ub418\uace0, \uc6cc\ud06c\ud50c\ub85c \ud6c4\ucc98\ub9ac \ud568\uc218\ub294 \uac12 \uc124\uc815\uc744 \uadf8\ub0e5 \uac74\ub108\ub701\ub2c8\ub2e4. \uc571\uc774 \uc7a0\uadfc \ud544\ub4dc(Sprint, Epic Link \ub4f1)\ub3c4 \uc5ec\uae30\uc5d0 \ub4e4\uc5b4\uac11\ub2c8\ub2e4.
janitor.help.status.act.at-risk=\uc774 \ub77c\ubca8\uc740 "\uc808\ub300 \uc9c0\uc6b0\uc9c0 \ub9c8\ub77c"\uac00 \uc544\ub2c8\ub77c "\uba3c\uc800 \uc815\ub9ac\ud560 \uac83\uc774 \uc788\ub2e4"\ub294 \ub73b\uc785\ub2c8\ub2e4. \uc0c1\uc138 \ud654\uba74\uc5d0\uc11c \ucc38\uc870 \uc704\uce58\ub97c \ud655\uc778\ud574 \uadf8\uac83\uc744 \uba3c\uc800 \uc81c\uac70\ud558\uba74 \ub77c\ubca8\uc774 \ub0b4\ub824\uac11\ub2c8\ub2e4. \ub2e8 \uc571\uc774 \uc7a0\uadfc \ud544\ub4dc\ub294 \uc608\uc678\uc785\ub2c8\ub2e4 \u2014 \uadf8 \uc571\uc744 \uacc4\uc18d \uc4f4\ub2e4\uba74 \uc190\ub300\uc9c0 \ub9c8\uc2ed\uc2dc\uc624.

janitor.help.status.order.title=\ud310\uc815 \uc21c\uc11c\uac00 \uc911\uc694\ud55c \uc774\uc720
janitor.help.status.order.body=\uc704\ud5d8\uc744 \ub9e8 \uba3c\uc800 \uac80\uc0ac\ud558\ub294 \uac83\uc740 \uc2ec\uac01\ub3c4 \ub54c\ubb38\uc774 \uc544\ub2c8\ub77c \ub193\uce58\uba74 \uc548 \ub418\uae30 \ub54c\ubb38\uc785\ub2c8\ub2e4. \ub2e4\ub978 \ub77c\ubca8\uc740 \uac12\uacfc \ud654\uba74 \uc22b\uc790\ub9cc \ubd10\ub3c4 \uc9d0\uc791\uc774 \ub418\uc9c0\ub9cc, \uc6cc\ud06c\ud50c\ub85c\ub098 \uc2a4\ud0b4 \ucc38\uc870\ub294 Jira \uae30\ubcf8 \ud654\uba74\uc5d0 \ud754\uc801\uc774 \uc804\ud600 \uc5c6\uc5b4\uc11c \ub77c\ubca8\uc774 \ub9d0\ud574\uc8fc\uc9c0 \uc54a\uc73c\uba74 \uc544\ubb34\ub3c4 \ubaa8\ub985\ub2c8\ub2e4. \ub418\ub3cc\ub9b4 \uc218 \uc5c6\ub2e4\ub294 \uae30\uc900\uc73c\ub85c \ubcf4\uba74 \uc624\ud788\ub824 \uace0\uc544 \ub370\uc774\ud130\uac00 \ub354 \uc704\ud5d8\ud569\ub2c8\ub2e4 \u2014 \uc704\ud5d8\uc740 \ucc38\uc870\ub97c \ub2e4\uc2dc \ubd99\uc774\uba74 \ubcf5\uad6c\ub418\uc9c0\ub9cc, \uc0ad\uc81c\ub41c \uac12\uc740 \ub3cc\uc544\uc624\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4.
janitor.help.status.notCounted.title=\ud310\uc815\uc5d0 \uc138\uc9c0 \uc54a\ub294 \ucc38\uc870
janitor.help.status.notCounted.body=\ud544\ub4dc \uc124\uc815(Field configurations)\uacfc \ucee8\ud14d\uc2a4\ud2b8(Contexts)\ub294 \uc0c1\ud0dc \ud310\uc815\uc5d0 \uc138\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4. Jira\ub294 \ucee4\uc2a4\ud140 \ud544\ub4dc\ub97c \ub9cc\ub4e4\uba74 \uc790\ub3d9\uc73c\ub85c \ubaa8\ub4e0 \ud544\ub4dc \uc124\uc815\uc5d0 \ub123\uace0 \uae30\ubcf8 \ucee8\ud14d\uc2a4\ud2b8\ub97c \uc8fc\uae30 \ub54c\ubb38\uc5d0, \uc544\ubb34 \ub370\ub3c4 \uc4f0\uc9c0 \uc54a\uc740 \uc0c8 \ud544\ub4dc\ub3c4 \uc774 \ub450 \ucc38\uc870\ub97c \ud56d\uc0c1 \uac16\uc2b5\ub2c8\ub2e4. \uc774\uac83\uc744 \uc0ac\uc6a9\uc758 \uc99d\uac70\ub85c \uc138\uba74 "\ubbf8\uc0ac\uc6a9" \ub77c\ubca8\uc774 \uc601\uc6d0\ud788 \ub098\uc624\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4. \uadf8\ub798\ub3c4 \ubaa9\ub85d\uc5d0\uc11c \ube7c\uc9c0 \uc54a\uace0 \ubcf4\uc5ec\uc8fc\ub294 \uc774\uc720\ub294 \ud544\ub4dc \uc124\uc815\uc758 "\ud544\uc218" \ud45c\uc2dc\uac00 \uc0ad\uc81c \ud310\ub2e8\uc5d0 \uc2e4\uc81c\ub85c \ud544\uc694\ud558\uae30 \ub54c\ubb38\uc785\ub2c8\ub2e4 \u2014 \ud544\uc218\ub85c \uac78\ub9b0 \ud544\ub4dc\ub97c \uc9c0\uc6b0\uba74 \uadf8 \ud504\ub85c\uc81d\ud2b8\uc758 \uc774\uc288 \uc0dd\uc131\uc774 \ub9c9\ud799\ub2c8\ub2e4.
janitor.help.status.confusion.title=\uace0\uc544 \ub370\uc774\ud130\uc640 \ubc29\uce58\ub97c \ud63c\ub3d9\ud558\uc9c0 \ub9c8\uc2ed\uc2dc\uc624
janitor.help.status.confusion.body=\ub458 \ub2e4 "\ud654\uba74\uc5d0\uc11c \uc544\ubb34\ub3c4 \uc785\ub825\ud560 \uc218 \uc5c6\ub294 \uc0c1\ud0dc"\ub77c \uac89\ubcf4\uae30\uac00 \ube44\uc2b7\ud55c\ub370 \ubc29\ud5a5\uc774 \uc815\ubc18\ub300\uc774\uace0 \uc870\uce58\ub3c4 \ubc18\ub300\uc785\ub2c8\ub2e4. \uace0\uc544 \ub370\uc774\ud130\ub294 \ub370\uc774\ud130\ub294 \uc788\ub294\ub370 \uc785\uad6c\uac00 \uc5c6\ub294 \uac83\uc774\uace0, \ubc29\uce58\ub294 \uc785\uad6c\ub294 \uc788\ub294\ub370 \ub370\uc774\ud130\uac00 \uc5c6\ub294 \uac83\uc785\ub2c8\ub2e4. \uace0\uc544 \ub370\uc774\ud130\ub97c \uc9c0\uc6b0\uba74 \uc815\ubcf4\uac00 \uc0ac\ub77c\uc9c0\uace0, \ubc29\uce58\ub294 \uc9c0\uc6cc\ub3c4 \uc783\uc744 \uac83\uc774 \uc5c6\uc2b5\ub2c8\ub2e4.

# --- 3. Field \uce78 \ud45c\uc2dc ---
janitor.help.badges.title=Field \uce78\uc5d0 \ubd99\ub294 \ud45c\uc2dc
janitor.help.badges.mark=\ud45c\uc2dc
janitor.help.badges.dup.name=\uc0bc\uac01\ud615 \ub290\ub08c\ud45c \u2014 \uc774\ub984 \uc911\ubcf5
janitor.help.badges.dup.body=\uac19\uc740 \uc774\ub984\uc758 \ucee4\uc2a4\ud140 \ud544\ub4dc\uac00 \ub458 \uc774\uc0c1 \uc788\uc2b5\ub2c8\ub2e4. \uc815\ub9ac\uac00 \ud544\uc694\ud55c \uc778\uc2a4\ud134\uc2a4\uc5d0\uc11c\ub294 \ud754\ud55c \uc77c\uc774\uace0, \ubcf4\ud1b5 \uadf8\uc911 \ud558\ub098\ub9cc \uc2e4\uc81c\ub85c \uc4f0\uc785\ub2c8\ub2e4. \uc774 \ud45c\uc2dc\uac00 \uc788\uc73c\uba74 \uc774\ub984\uc73c\ub85c \ud310\ub2e8\ud558\uc9c0 \ub9c8\uc2dc\uace0 \ubc18\ub4dc\uc2dc \ud544\ub4dc ID\ub85c \ub300\uc0c1\uc744 \ud655\uc778\ud558\uc2ed\uc2dc\uc624. \uc774\ub984\uc774 \uac19\uc544\ub3c4 \uac12 \uc218\uc640 \ud654\uba74 \uc218\uac00 \ub2e4\ub974\ubbc0\ub85c \ubaa9\ub85d\uc5d0\uc11c \uac01 \ud589\uc758 \uc22b\uc790\ub97c \ube44\uad50\ud558\uba74 \uc5b4\ub290 \uac83\uc774 \uc2e4\uc81c\ub85c \uc4f0\uc774\ub294\uc9c0 \ubcf4\uc785\ub2c8\ub2e4. \uc774 \ud45c\uc2dc\uac00 \uc788\uc73c\uba74 \ub9c8\uc9c0\ub9c9 \uac12 \ubcc0\uacbd\uc77c\ub3c4 \uc2e0\ub8b0\ud560 \uc218 \uc5c6\uc2b5\ub2c8\ub2e4.
janitor.help.badges.locked.name=\uc7a0\uae40 \u2014 \uc571\uc774 \uad00\ub9ac\ud558\ub294 \ud544\ub4dc
janitor.help.badges.locked.body=\uc571\uc774 \uc774 \ud544\ub4dc\ub97c \uc7a0\uac14\uc2b5\ub2c8\ub2e4. Jira \uc790\uc2e0\ub3c4 \uc774 \ud544\ub4dc\uc758 \uc0ad\uc81c \uba54\ub274\ub97c \uc228\uae30\ubbc0\ub85c \uc774 \ub3c4\uad6c\uc758 \uc0c1\uc138 \ud654\uba74\uc5d0\ub3c4 \uc0ad\uc81c \ub9c1\ud06c\ub97c \ub450\uc9c0 \uc54a\uc558\uc2b5\ub2c8\ub2e4. Sprint, Epic Link, Rank\ucc98\ub7fc Jira Software\uac00 \ub9cc\ub4e0 \ud544\ub4dc\uac00 \ub300\ud45c\uc801\uc785\ub2c8\ub2e4. \uc9c0\uc6b0\uba74 \uadf8 \uc571\uc774 \uae68\uc9d1\ub2c8\ub2e4. \uc774 \ud544\ub4dc\ub4e4\uc740 \uac12\uc744 \uc571 \uc790\uccb4 \ud14c\uc774\ube14\uc5d0 \uc800\uc7a5\ud558\ub294 \uacbd\uc6b0\uac00 \ub9ce\uc544\uc11c "\uac12 \uc788\ub294 \uc774\uc288 \uc218"\uac00 0\uc73c\ub85c \ubcf4\uc77c \uc218 \uc788\ub294\ub370, \uadf8 0\uc744 "\uc548 \uc4f0\ub294 \ud544\ub4dc"\ub85c \uc77d\uc73c\uba74 \uc548 \ub429\ub2c8\ub2e4.
janitor.help.badges.typeUnavailable.name=\ud0c0\uc785 \uc5c6\uc74c \u2014 \uc81c\uacf5 \uc571\uc774 \ube44\ud65c\uc131
janitor.help.badges.typeUnavailable.body=\uc774 \ud544\ub4dc\uc758 \ud0c0\uc785\uc744 \uc81c\uacf5\ud558\ub294 \uc571\uc774 \ube44\ud65c\uc131\uc774\uac70\ub098 \uc0ad\uc81c\ub418\uc5c8\uc2b5\ub2c8\ub2e4. Jira\ub294 \uc774 \uc0c1\ud0dc\uc758 \ud544\ub4dc\ub97c \ucee4\uc2a4\ud140 \ud544\ub4dc \ubaa9\ub85d\uc5d0\uc11c \uc544\uc608 \uc228\uae30\uc9c0\ub9cc, \ud544\ub4dc\uc640 \uac12\uc740 DB\uc5d0 \uadf8\ub300\ub85c \ub0a8\uc544 \uc788\uc2b5\ub2c8\ub2e4. \uc774 \ub3c4\uad6c\ub294 DB\ub97c \uae30\uc900\uc73c\ub85c \ubaa9\ub85d\uc744 \ub9cc\ub4e4\uae30 \ub54c\ubb38\uc5d0 \uadf8 \ud544\ub4dc\ub4e4\ub3c4 \ubcf4\uc5ec\uc90d\ub2c8\ub2e4 \u2014 \uc571\uc744 \uc9c0\uc6b4 \ub4a4 \ub0a8\uc740 \uc794\ud574\uac00 \ubcf4\ud1b5 \uc815\ub9ac \ub300\uc0c1 1\uc21c\uc704\uc785\ub2c8\ub2e4. \ub2e4\ub9cc \uc774 \ud544\ub4dc\ub294 Jira API\ub85c \ub2e4\ub8f0 \uc218 \uc5c6\uc5b4\uc11c \ucee8\ud14d\uc2a4\ud2b8\ub97c \uc77d\uc9c0 \ubabb\ud558\uace0, \uc571\uc744 \ub2e4\uc2dc \ucf1c\uba74 \ub418\uc0b4\uc544\ub0a9\ub2c8\ub2e4.
janitor.help.badges.inaccurate.name=\ubd80\uc815\ud655 \u2014 \ub9c8\uc9c0\ub9c9 \ubcc0\uacbd\uc77c\uc744 \ubbff\uc744 \uc218 \uc5c6\uc74c
janitor.help.badges.inaccurate.body=\ub9c8\uc9c0\ub9c9 \uac12 \ubcc0\uacbd\uc77c \uce78\uc5d0 \ub098\uc635\ub2c8\ub2e4. \uc774\ub984\uc774 \uc911\ubcf5\ub41c \ud544\ub4dc\ub77c\uc11c \ubcc0\uacbd \uc774\ub825\uc774 \ub2e4\ub978 \ud544\ub4dc\uc640 \uc11e\uc774\ub294 \uacbd\uc6b0\uc785\ub2c8\ub2e4. \uc798\ubabb\ub41c \ub0a0\uc9dc\ub97c \ubcf4\uc5ec\uc8fc\ub294 \ub300\uc2e0 \uac12\uc744 \ube44\uc6e0\uc2b5\ub2c8\ub2e4.

# --- 4. \uc0c1\uc138 \ud654\uba74 ---
janitor.help.detail.title=\uc0c1\uc138 \ud654\uba74 (\ud544\ub4dc \uc0ac\uc6a9\ucc98 \u2014 \ud544\ub4dc\uba85)
janitor.help.detail.intro=\ubaa9\ub85d\uc5d0\uc11c \ud544\ub4dc \uc774\ub984\uc744 \ud074\ub9ad\ud558\uba74 \uadf8 \ud544\ub4dc\uac00 \uc5b4\ub514\uc11c \uc4f0\uc774\ub294\uc9c0 \uc885\ub958\ubcc4\ub85c \ub098\uc635\ub2c8\ub2e4. \uac01 \ud56d\ubaa9\uc740 \ud574\ub2f9 Jira \uad00\ub9ac \ud654\uba74\uc73c\ub85c \uc5f0\uacb0\ub418\ub2c8, \ucc38\uc870\ub97c \uc815\ub9ac\ud558\ub824\uba74 \ub9c1\ud06c\ub97c \ub20c\ub7ec \uadf8 \ud654\uba74\uc5d0\uc11c \ud558\uc2dc\uba74 \ub429\ub2c8\ub2e4. \ub2e4\ub978 \ud654\uba74\uc5d0\uc11c \ub9c1\ud06c\ub85c \ubc14\ub85c \ub4e4\uc5b4\uc624\ub824\uba74 \uc8fc\uc18c \ub05d\uc5d0 ?fieldId=customfield_10001 \uc744 \ubd99\uc774\uba74 \ub429\ub2c8\ub2e4.
janitor.help.detail.summary.title=\uc0c1\ub2e8 \uc694\uc57d
janitor.help.detail.summary.body=\uc0c1\ud0dc \ub77c\ubca8, \uac12 \uc788\ub294 \uc774\uc288 \uc218, \uac12 \ud589 \uc218, \ub9c8\uc9c0\ub9c9 \uac12 \ubcc0\uacbd\uc77c, \ud0c0\uc785, \ucee8\ud14d\uc2a4\ud2b8(\uc774 \ud544\ub4dc\ub97c \uc4f8 \uc218 \uc788\ub294 \ud504\ub85c\uc81d\ud2b8\uc640 \uc774\uc288 \ud0c0\uc785 \ubc94\uc704)\uac00 \ub098\uc635\ub2c8\ub2e4. \ucee8\ud14d\uc2a4\ud2b8\ub294 "\uc4f8 \uc218 \uc788\ub294 \ubc94\uc704"\uc77c \ubfd0 \uc2e4\uc81c \uc0ac\uc6a9\uc758 \uc99d\uac70\uac00 \uc544\ub2d9\ub2c8\ub2e4 \u2014 \uc804\uccb4 \ud504\ub85c\uc81d\ud2b8\ub85c \uc5f4\ub824 \uc788\uc5b4\ub3c4 \uc544\ubb34\ub3c4 \uc548 \uc4f8 \uc218 \uc788\uc2b5\ub2c8\ub2e4. \uadf8 \uc544\ub798 \ud30c\ub780 \uc0c1\uc790\uc758 \ud55c \uc904\uc774 \uc774 \ub3c4\uad6c\uc758 \ud310\ub2e8 \uc694\uc57d\uc785\ub2c8\ub2e4.
janitor.help.detail.refs.title=\ucc38\uc870 \uce74\ud14c\uace0\ub9ac
janitor.help.detail.refs.intro=\uc81c\ubaa9 \uc606 \uad04\ud638 \uc548\uc758 \uc22b\uc790\uac00 \uadf8 \uc885\ub958\uc5d0\uc11c \ubc1c\uacac\ub41c \uac74\uc218\uc785\ub2c8\ub2e4. \uc608\ub97c \ub4e4\uc5b4 "\ud654\uba74 (2)"\ub294 \uc774 \ud544\ub4dc\uac00 \ub450 \uac1c\uc758 \ud654\uba74\uc5d0 \ub193\uc5ec \uc788\ub2e4\ub294 \ub73b\uc785\ub2c8\ub2e4. 0\uac74\uc778 \uce74\ud14c\uace0\ub9ac\ub3c4 \uc228\uae30\uc9c0 \uc54a\uace0 \ubcf4\uc5ec\uc90d\ub2c8\ub2e4 \u2014 0\uc778\uc9c0 \ubabb \ucc3e\uc740 \uac83\uc778\uc9c0 \uad6c\ubd84\ub418\uc5b4\uc57c \ud558\uae30 \ub54c\ubb38\uc785\ub2c8\ub2e4.
janitor.help.detail.refs.category=\uce74\ud14c\uace0\ub9ac
janitor.help.detail.refs.ifDeleted=\uc774 \ud544\ub4dc\ub97c \uc9c0\uc6b0\uba74
janitor.help.detail.refs.notEvidence=\uc0c1\ud0dc \ud310\uc815\uc5d0 \uc138\uc9c0 \uc54a\uc74c
janitor.help.detail.cols.title=\ucc38\uc870 \ud45c\uc758 \uc138 \uceec\ub7fc
janitor.help.detail.cols.target=\ucc38\uc870\ud558\uace0 \uc788\ub294 \ub300\uc0c1\uc758 \uc774\ub984\uc785\ub2c8\ub2e4. \ub9c1\ud06c\uac00 \uac78\ub824 \uc788\uc73c\uba74 \uadf8 \ub300\uc0c1\uc758 Jira \uad00\ub9ac \ud654\uba74\uc73c\ub85c \uac11\ub2c8\ub2e4. "\ub3d9\uc791\uc774 \uae68\uc9d0" \ubc30\uc9c0\uac00 \ubd99\uc740 \ud56d\ubaa9\uc774 \uc0c1\ud0dc\ub97c \uc704\ud5d8\uc73c\ub85c \ub9cc\ub4e0 \uc6d0\uc778\uc785\ub2c8\ub2e4.
janitor.help.detail.cols.where=\ub300\uc0c1 \uc548\uc5d0\uc11c \uc5b4\ub514\uc5d0 \uc788\ub294\uc9c0\uc785\ub2c8\ub2e4. \ud654\uba74\uc774\uba74 \ud0ed \uc774\ub984, \uc6cc\ud06c\ud50c\ub85c\uba74 \uc804\uc774 \uc774\ub984\uacfc \uc704\uce58(\uc870\uac74\u00b7\uac80\uc99d\uae30\u00b7\uc804\ucc98\ub9ac \ud568\uc218\u00b7\ud6c4\ucc98\ub9ac \ud568\uc218\u00b7\uc804\uc774 \ud654\uba74), \ud544\ub4dc \uc124\uc815\uc774\uba74 \ud45c\uc2dc/\uc228\uae40/\ud544\uc218, \ud544\ud130\uba74 \uc791\uc131\uc790\uc640 JQL \ubc1c\ucdcc\uac00 \ub098\uc635\ub2c8\ub2e4. \uc6cc\ud06c\ud50c\ub85c\uc5d0\uc11c "\uc22b\uc790 ID \uc77c\uce58 (\ucd94\uc815)"\uc774\ub77c\uace0 \ub098\uc624\uba74 \uc11c\ub4dc\ud30c\ud2f0 \uc571 \uc124\uc815\uc5d0 \ud544\ub4dc ID\uc640 \uac19\uc740 \uc22b\uc790\uac00 \uc788\uc5c8\ub2e4\ub294 \ub73b\uc774\uace0 \ud655\uc815\ub41c \ucc38\uc870\uac00 \uc544\ub2d9\ub2c8\ub2e4 \u2014 \ud574\uacb0\ucc45\uc774\ub098 \uc0c1\ud0dc ID\uc640 \uc6b0\uc5f0\ud788 \uac19\uc744 \uc218 \uc788\uc2b5\ub2c8\ub2e4.
janitor.help.detail.cols.projects=\uadf8 \ucc38\uc870\uac00 \uacb0\uad6d \uc5b4\ub290 \ud504\ub85c\uc81d\ud2b8\uc5d0 \ub2ff\ub294\uc9c0\uc785\ub2c8\ub2e4. \ud654\uba74\uc758 \uacbd\uc6b0 \ud504\ub85c\uc81d\ud2b8 \uc774\ub984\uacfc \ud568\uaed8 \uc774\uc288 \ud0c0\uc785 \ud654\uba74 \uc2a4\ud0b4 \u203a \ud654\uba74 \uc2a4\ud0b4 \u203a \uc791\uc5c5(\uc0dd\uc131/\ud3b8\uc9d1)\uae4c\uc9c0 \ub098\uc635\ub2c8\ub2e4. Jira \uae30\ubcf8 \ud654\uba74\uc740 \ud654\uba74 \uc774\ub984\uae4c\uc9c0\ub9cc \uc54c\ub824\uc8fc\uae30 \ub54c\ubb38\uc5d0 "\uc774 \ud544\ub4dc\uac00 \uacb0\uad6d \uc5b4\ub290 \ud504\ub85c\uc81d\ud2b8\uc758 \uc5b4\ub290 \ud654\uba74\uc5d0 \ub098\ud0c0\ub098\ub294\uac00"\ub97c \uc54c\ub824\uba74 \uc2a4\ud0b4\uc744 \uc5ec\ub7ec \ubc88 \ud0c0\uace0 \ub4e4\uc5b4\uac00\uc57c \ud558\ub294\ub370, \uadf8 \uccb4\uc778\uc744 \ub300\uc2e0 \ub530\ub77c\uac04 \uacb0\uacfc\uc785\ub2c8\ub2e4. \ube44\uc5b4 \uc788\uc73c\uba74 \uc5b4\ub290 \ud504\ub85c\uc81d\ud2b8\uc5d0\ub3c4 \uc5f0\uacb0\ub418\uc9c0 \uc54a\uc740 \uc124\uc815\uc774\ub77c\ub294 \ub73b\uc785\ub2c8\ub2e4.
janitor.help.detail.numbers.title=\ubaa9\ub85d\uc758 \uc22b\uc790\uc640 \uc0c1\uc138\uc758 \uac74\uc218\uac00 \ub2e4\ub97c \ub54c
janitor.help.detail.numbers.body=\ubaa9\ub85d\uc758 "\ucc38\uc870 \ud569\uacc4"\ub294 \ud544\ub4dc \uc124\uc815\uacfc \ucee8\ud14d\uc2a4\ud2b8\uae4c\uc9c0 \ud3ec\ud568\ud55c \ubaa8\ub4e0 \ucc38\uc870\uc758 \uc218\uc785\ub2c8\ub2e4. \uc0c1\ud0dc \ud310\uc815\uc5d0 \uc4f0\uc774\ub294 \uc218\ub294 \uadf8 \ub458\uc744 \ube80 \uac12\uc774\ub77c \ub354 \uc791\uc2b5\ub2c8\ub2e4. \ubaa9\ub85d\uc5d0 \ud654\uba74\u00b7\uc6cc\ud06c\ud50c\ub85c\u00b7\ud544\ud130\u00b7\uac00\uc82f \uceec\ub7fc\ub9cc \uc788\ub294 \uac83\uc740 \uc9c0\uba74 \ub54c\ubb38\uc774\uace0, \uad8c\ud55c\u00b7\uc54c\ub9bc\u00b7\uc774\uc288 \ubcf4\uc548 \uc2a4\ud0b4 \ucc38\uc870\ub294 \uc0c1\uc138 \ud654\uba74\uacfc CSV\uc5d0 \uc788\uc2b5\ub2c8\ub2e4.

# --- \ucc38\uc870 \uce74\ud14c\uace0\ub9ac\ubcc4 \uc124\uba85 ---
janitor.help.ref.desc.managed=\uc571\uc774 \uc774 \ud544\ub4dc\ub97c \uc790\uae30 \uac83\uc73c\ub85c \ub4f1\ub85d\ud558\uace0 \uc7a0\uadfc \uc0c1\ud0dc\uc785\ub2c8\ub2e4. \uc5b4\ub290 \uc571\uc774 \uc7a0\uac14\ub294\uc9c0 \uc774\ub984\uc774 \ub098\uc635\ub2c8\ub2e4.
janitor.help.ref.impact.managed=\uadf8 \uc571\uc774 \uae68\uc9d1\ub2c8\ub2e4. \uc608\ub97c \ub4e4\uc5b4 Sprint\ub97c \uc9c0\uc6b0\uba74 Jira Software \ubcf4\ub4dc\uac00 \ub3d9\uc791\ud558\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4. Jira\ub3c4 \uc774 \ud544\ub4dc\uc758 \uc0ad\uc81c\ub97c \ub9c9\uc2b5\ub2c8\ub2e4.
janitor.help.ref.desc.screen=\uc774 \ud544\ub4dc\uac00 \ub193\uc778 \ud654\uba74\uc785\ub2c8\ub2e4. \ud0ed \uc774\ub984\uacfc \uadf8 \ud654\uba74\uc774 \ub2ff\ub294 \ud504\ub85c\uc81d\ud2b8 \uccb4\uc778\uc774 \ud568\uaed8 \ub098\uc635\ub2c8\ub2e4.
janitor.help.ref.impact.screen=\uadf8 \ud654\uba74\uc5d0\uc11c \ud544\ub4dc\uac00 \uc0ac\ub77c\uc9d1\ub2c8\ub2e4. \uac12\ub3c4 \ud568\uaed8 \uc0ad\uc81c\ub429\ub2c8\ub2e4. \ud654\uba74\uc5d0\uc11c\ub9cc \ube7c\uace0 \uc2f6\ub2e4\uba74 \uc0ad\uc81c\uac00 \uc544\ub2c8\ub77c \ud654\uba74 \uc124\uc815\uc744 \uace0\uce58\uc2ed\uc2dc\uc624.
janitor.help.ref.desc.fieldConfig=\ud544\ub4dc \uc124\uc815\uc5d0\uc11c\uc758 \ud45c\uc2dc\u00b7\uc228\uae40\u00b7\ud544\uc218 \uc5ec\ubd80\uc785\ub2c8\ub2e4. Jira\uac00 \ubaa8\ub4e0 \ud544\ub4dc\ub97c \uc790\ub3d9\uc73c\ub85c \ubaa8\ub4e0 \ud544\ub4dc \uc124\uc815\uc5d0 \ub123\uae30 \ub54c\ubb38\uc5d0 \uc774 \ucc38\uc870\ub294 \uac70\uc758 \ud56d\uc0c1 \uc788\uc2b5\ub2c8\ub2e4.
janitor.help.ref.impact.fieldConfig=\ud544\uc218\ub85c \uac78\ub824 \uc788\uc73c\uba74 \uc9c0\uc6b0\uae30 \uc804\uc5d0 \ubc18\ub4dc\uc2dc \ud655\uc778\ud558\uc2ed\uc2dc\uc624. \ud544\uc218 \ud544\ub4dc\ub97c \uc9c0\uc6b0\uba74 \ud574\ub2f9 \ud504\ub85c\uc81d\ud2b8\uc758 \uc774\uc288 \uc0dd\uc131\u00b7\ud3b8\uc9d1\uc774 \ub9c9\ud790 \uc218 \uc788\uc2b5\ub2c8\ub2e4.
janitor.help.ref.desc.context=\uc774 \ud544\ub4dc\ub97c \uc4f8 \uc218 \uc788\ub294 \ud504\ub85c\uc81d\ud2b8\uc640 \uc774\uc288 \ud0c0\uc785\uc758 \ubc94\uc704\uc785\ub2c8\ub2e4. \ud544\ub4dc\ub97c \ub9cc\ub4e4\uba74 \uae30\ubcf8 \ucee8\ud14d\uc2a4\ud2b8\uac00 \uc790\ub3d9\uc73c\ub85c \uc0dd\uae41\ub2c8\ub2e4.
janitor.help.ref.impact.context=\ubc94\uc704 \uc124\uc815\uc774 \ud568\uaed8 \uc0ac\ub77c\uc9d1\ub2c8\ub2e4. \uc0ac\uc6a9\uc758 \uc99d\uac70\uac00 \uc544\ub2c8\ubbc0\ub85c \uc774\uac83\ub9cc \uc788\ub294 \ud544\ub4dc\ub294 \ubbf8\uc0ac\uc6a9\uc73c\ub85c \ud310\uc815\ub429\ub2c8\ub2e4.
janitor.help.ref.desc.workflow=\uc6cc\ud06c\ud50c\ub85c\uc758 \uc870\uac74, \uac80\uc99d\uae30, \uc804\u00b7\ud6c4\ucc98\ub9ac \ud568\uc218, \uc804\uc774 \ud654\uba74\uc5d0\uc11c \uc774 \ud544\ub4dc\ub97c \ucc38\uc870\ud569\ub2c8\ub2e4. \uc804\uc774 \uc774\ub984\uacfc \uc704\uce58\uac00 \ud568\uaed8 \ub098\uc635\ub2c8\ub2e4.
janitor.help.ref.impact.workflow=\uadf8 \uc804\uc774\uc758 \ub3d9\uc791\uc774 \uc870\uc6a9\ud788 \uae68\uc9d1\ub2c8\ub2e4. \ud544\uc218 \ud544\ub4dc \uac80\uc99d\uae30\ub294 \uac80\uc99d\uc744 \uac74\ub108\ub6f0\uace0, \uac12 \uc124\uc815 \ud6c4\ucc98\ub9ac \ud568\uc218\ub294 \uc544\ubb34 \uc77c\ub3c4 \ud558\uc9c0 \uc54a\uac8c \ub429\ub2c8\ub2e4. \uc624\ub958 \uba54\uc2dc\uc9c0\uac00 \ub098\uc624\uc9c0 \uc54a\uc544\uc11c \ubc1c\uacac\uc774 \ub2a6\uc2b5\ub2c8\ub2e4.
janitor.help.ref.desc.filter=\uc800\uc7a5\ub41c \uac80\uc0c9(\ud544\ud130)\uc758 JQL\uc774 \uc774 \ud544\ub4dc\ub97c \ucc38\uc870\ud569\ub2c8\ub2e4. \ud544\ub4dc \uc774\ub984\uc73c\ub85c \uc4f4 \uacbd\uc6b0\uc640 cf[ID]\ub85c \uc4f4 \uacbd\uc6b0\ub97c \ubaa8\ub450 \ucc3e\uc2b5\ub2c8\ub2e4.
janitor.help.ref.impact.filter=\uadf8 \ud544\ud130\uac00 \uae68\uc838\uc11c \uc2e4\ud589\ub418\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4. \ud544\ud130\ub97c \ub300\uc2dc\ubcf4\ub4dc\ub098 \uac00\uc82f\uc5d0\uc11c \uc4f0\uace0 \uc788\uc73c\uba74 \uadf8\uac83\ub3c4 \ud568\uaed8 \uba48\ucda5\ub2c8\ub2e4.
janitor.help.ref.desc.permissionScheme=\uad8c\ud55c \uc2a4\ud0b4\uc774 \uc774 \ud544\ub4dc\uc758 \uac12\uc744 \uad8c\ud55c \ub300\uc0c1\uc790\ub85c \uc501\ub2c8\ub2e4(User custom field value / Group custom field value).
janitor.help.ref.impact.permissionScheme=\uadf8 \uad8c\ud55c \ud56d\ubaa9\uc774 \uc544\ubb34\uc5d0\uac8c\ub3c4 \uad8c\ud55c\uc744 \uc8fc\uc9c0 \uc54a\uac8c \ub429\ub2c8\ub2e4. \uc624\ub958 \uc5c6\uc774 \uc870\uc6a9\ud788 \uad8c\ud55c\uc774 \uc0ac\ub77c\uc9c0\ubbc0\ub85c \uc774 \ub3c4\uad6c\uc5d0\uc11c \uac00\uc7a5 \uc870\uc2ec\ud574\uc57c \ud558\ub294 \ucc38\uc870\uc785\ub2c8\ub2e4.
janitor.help.ref.desc.notificationScheme=\uc54c\ub9bc \uc2a4\ud0b4\uc774 \uc774 \ud544\ub4dc\uc758 \uac12\uc744 \uc218\uc2e0\uc790\ub85c \uc501\ub2c8\ub2e4.
janitor.help.ref.impact.notificationScheme=\uadf8 \uc54c\ub9bc\uc774 \uc544\ubb34\uc5d0\uac8c\ub3c4 \uac00\uc9c0 \uc54a\uac8c \ub429\ub2c8\ub2e4. \uba54\uc77c\uc774 \uc548 \uc628\ub2e4\ub294 \ubb38\uc758\uac00 \ud55c\ucc38 \ub4a4\uc5d0 \ub4e4\uc5b4\uc635\ub2c8\ub2e4.
janitor.help.ref.desc.issueSecurityScheme=\uc774\uc288 \ubcf4\uc548 \uc2a4\ud0b4\uc774 \uc774 \ud544\ub4dc\uc758 \uac12\uc744 \ubcf4\uc548 \uc218\uc900 \ub300\uc0c1\uc790\ub85c \uc501\ub2c8\ub2e4.
janitor.help.ref.impact.issueSecurityScheme=\ud574\ub2f9 \ubcf4\uc548 \uc218\uc900\uc758 \uc774\uc288\uac00 \uc544\ubb34\uc5d0\uac8c\ub3c4 \ubcf4\uc774\uc9c0 \uc54a\uac8c \ub420 \uc218 \uc788\uc2b5\ub2c8\ub2e4.
janitor.help.ref.desc.gadget=\ub300\uc2dc\ubcf4\ub4dc \uac00\uc82f \uc124\uc815\uc5d0 \uc774 \ud544\ub4dc\uac00 \ub4e4\uc5b4 \uc788\uc2b5\ub2c8\ub2e4. \uc5b4\ub290 \ub300\uc2dc\ubcf4\ub4dc\uc758 \uc5b4\ub290 \uac00\uc82f\uc778\uc9c0 \ub098\uc635\ub2c8\ub2e4.
janitor.help.ref.impact.gadget=\uadf8 \uac00\uc82f\uc774 \uc624\ub958\ub97c \ub0b4\uac70\ub098 \ube48 \uacb0\uacfc\ub97c \ubcf4\uc5ec\uc90d\ub2c8\ub2e4.
janitor.help.ref.desc.columnLayout=\uc774\uc288 \ubaa9\ub85d(\ub124\ube44\uac8c\uc774\ud130)\uc5d0 \uc774 \ud544\ub4dc\ub97c \uceec\ub7fc\uc73c\ub85c \ub744\uc6b0\ub294 \uc124\uc815\uc785\ub2c8\ub2e4. \uc2dc\uc2a4\ud15c \uae30\ubcf8 \uceec\ub7fc, \ud544\ud130\uc5d0 \ubd99\uc740 \uceec\ub7fc, \uc0ac\uc6a9\uc790 \uac1c\uc778 \uc124\uc815 \uc14b\uc73c\ub85c \ub098\ub220 \ubcf4\uc5ec\uc90d\ub2c8\ub2e4. \uac1c\uc778 \uc124\uc815\uc740 \ud544\ub4dc\ub9c8\ub2e4 \ud55c \uc904\ub85c \ubb36\uace0 \uba87 \uba85\uc778\uc9c0 \ud568\uaed8 \uc801\uc2b5\ub2c8\ub2e4.
janitor.help.ref.impact.columnLayout=\uadf8 \ubaa9\ub85d\uc5d0\uc11c \uceec\ub7fc\uc774 \uc0ac\ub77c\uc9d1\ub2c8\ub2e4. \ub3d9\uc791\uc774 \uae68\uc9c0\uc9c0\ub294 \uc54a\uc9c0\ub9cc, \ub204\uad70\uac00 \uc774 \ud544\ub4dc\ub97c \ubcf4\ub824\uace0 \uc9c1\uc811 \uace8\ub77c \ub123\uc5c8\ub2e4\ub294 \ub73b\uc774\ubbc0\ub85c \uc0ac\uc6a9\uc758 \uc99d\uac70\ub85c \uc149\ub2c8\ub2e4.

# --- 5. \uc0ad\uc81c \ud310\ub2e8 ---
janitor.help.decide.title=\uc0ad\uc81c \ud310\ub2e8 \u2014 \uc138 \uac08\ub798
janitor.help.decide.intro=\ub77c\ubca8\uacfc \uc22b\uc790\ub97c \ubcf4\uace0 \uc544\ub798 \uc14b \uc911 \ud558\ub098\ub85c \ubd84\ub958\ud558\uc2ed\uc2dc\uc624. \ud310\ub2e8\uc740 \uad00\ub9ac\uc790\uac00 \ud558\uace0, \uc2e4\ud589\uc740 Jira \ud45c\uc900 \ud654\uba74\uc5d0\uc11c \ud569\ub2c8\ub2e4.
janitor.help.decide.safe.title=\uc0ad\uc81c\ud574\ub3c4 \ubb34\ubc29\ud55c \uac83
janitor.help.decide.safe.body=\ubbf8\uc0ac\uc6a9 \ub77c\ubca8\uc774\uace0, \uac12 0 \u00b7 \ud654\uba74 0 \u00b7 \uc6cc\ud06c\ud50c\ub85c 0 \u00b7 \ud544\ud130 0 \u00b7 \uac00\uc82f 0 \u00b7 \uc2a4\ud0b4 0\uc774\uba70, \uc7a0\uae40 \ud45c\uc2dc\uac00 \uc5c6\ub294 \ud544\ub4dc\uc785\ub2c8\ub2e4. \uc774 \ub3c4\uad6c\uac00 \ubcfc \uc218 \uc788\ub294 \ubc94\uc704\uc5d0\uc11c\ub294 \uc783\uc744 \uac83\uc774 \uc5c6\uc2b5\ub2c8\ub2e4. \ub2e4\ub9cc 7\uc7a5\uc758 \ud55c\uacc4\ub97c \ud568\uaed8 \ubcf4\uc2ed\uc2dc\uc624 \u2014 Agile \ubcf4\ub4dc \uc124\uc815\uacfc \uc77c\ubd80 \uc11c\ub4dc\ud30c\ud2f0 \uc571 \uc124\uc815\uc740 \ud655\uc778\ub418\uc9c0 \uc54a\uc558\uc2b5\ub2c8\ub2e4. \uc2e4\ubb34\uc5d0\uc11c\ub294 \ubaa9\ub85d\uc744 CSV\ub85c \ubf51\uc544 \uad00\ub828 \ud300\uc5d0 \ud55c \ubc88 \ub3cc\ub9ac\uace0 \uc77c\uc8fc\uc77c \uc815\ub3c4 \uc774\uc758\uac00 \uc5c6\uc73c\uba74 \uc9c0\uc6b0\ub294 \ubc29\uc2dd\uc744 \uad8c\ud569\ub2c8\ub2e4.
janitor.help.decide.check.title=\uc0ad\uc81c \uc804 \ud655\uc778\ud574\uc57c \ud560 \uac83
janitor.help.decide.check.body=\uace0\uc544 \ub370\uc774\ud130, \ubc29\uce58, \uadf8\ub9ac\uace0 \ud544\ud130\u00b7\uac00\uc82f \ucc38\uc870\ub9cc \uc788\ub294 \ud544\ub4dc\uc785\ub2c8\ub2e4. \uace0\uc544 \ub370\uc774\ud130\ub294 \uac12\uc774 \uc544\uc9c1 \ud544\uc694\ud55c\uc9c0(\uac10\uc0ac\u00b7\uc9d1\uacc4\u00b7\uacfc\uac70 \uc774\ub825) \ud655\uc778\ud558\uace0, \ud544\uc694 \uc5c6\uc73c\uba74 CSV\ub098 JQL\ub85c \uba3c\uc800 \ubf51\uc544 \ub450\uc2ed\uc2dc\uc624. \ubc29\uce58\ub294 \uc0ad\uc81c\ubcf4\ub2e4 \ud654\uba74\uc5d0\uc11c \uc81c\uac70\ub97c \uba3c\uc800 \ud558\uc2ed\uc2dc\uc624. \ud544\ub4dc \uc124\uc815\uc5d0 "\ud544\uc218"\ub85c \uac78\ub824 \uc788\ub294\uc9c0\ub3c4 \uc0c1\uc138 \ud654\uba74\uc5d0\uc11c \ud655\uc778\ud558\uc2ed\uc2dc\uc624 \u2014 \ud544\uc218 \ud544\ub4dc\ub97c \uc9c0\uc6b0\uba74 \uc774\uc288 \uc0dd\uc131\uc774 \ub9c9\ud790 \uc218 \uc788\uc2b5\ub2c8\ub2e4. \uc774\ub984\uc774 \uc911\ubcf5\ub41c \ud544\ub4dc\ub294 \ubc18\ub4dc\uc2dc ID\ub85c \ub300\uc0c1\uc744 \ub2e4\uc2dc \ud655\uc778\ud558\uc2ed\uc2dc\uc624.
janitor.help.decide.stop.title=\uc9c0\uae08 \uc9c0\uc6b0\uba74 \uc548 \ub418\ub294 \uac83
janitor.help.decide.stop.body=\ud65c\uc131 \ub77c\ubca8\uc740 \uc815\uc0c1 \uc0ac\uc6a9 \uc911\uc774\ubbc0\ub85c \ub300\uc0c1\uc774 \uc544\ub2d9\ub2c8\ub2e4. \uc704\ud5d8 \ub77c\ubca8 \uc911 \uc571\uc774 \uc7a0\uadfc \ud544\ub4dc(Sprint, Epic Link, Rank \ub4f1)\ub294 \uadf8 \uc571\uc744 \uc4f0\ub294 \ub3d9\uc548 \uc190\ub300\uc9c0 \ub9c8\uc2ed\uc2dc\uc624. \ub098\uba38\uc9c0 \uc704\ud5d8 \ub77c\ubca8\uc740 \ucc38\uc870\ub97c \uba3c\uc800 \uc815\ub9ac\ud558\uba74 \uc9c0\uc6b8 \uc218 \uc788\uac8c \ub429\ub2c8\ub2e4 \u2014 \uc0c1\uc138 \ud654\uba74\uc5d0\uc11c \uc6cc\ud06c\ud50c\ub85c \uc804\uc774\ub098 \uc2a4\ud0b4 \ud56d\ubaa9\uc744 \ucc3e\uc544 \uadf8\uac83\uc744 \uba3c\uc800 \uc81c\uac70\ud558\uace0 \ub2e4\uc2dc \uc2a4\uce94\ud558\uc2ed\uc2dc\uc624. \ub77c\ubca8\uc774 \ubc29\uce58\ub098 \ubbf8\uc0ac\uc6a9\uc73c\ub85c \ub0b4\ub824\uc624\uba74 \uadf8\ub54c \ud310\ub2e8\ud558\uc2ed\uc2dc\uc624.
janitor.help.decide.steps.title=\uad8c\uc7a5 \uc815\ub9ac \uc808\ucc28
janitor.help.decide.steps.1=\uc2a4\uce94\uc744 \uc2e4\ud589\ud558\uace0 CSV\ub85c \ub0b4\ubcf4\ub0b4 \ud604\uc7ac \uc0c1\ud0dc\ub97c \uae30\ub85d\ud574 \ub461\ub2c8\ub2e4. \uc815\ub9ac \uc804 \uc2a4\ub0c5\uc0f7\uc774 \uc788\uc73c\uba74 \ub098\uc911\uc5d0 \ubb34\uc5c7\uc744 \uc65c \uc9c0\uc6e0\ub294\uc9c0 \uc124\uba85\ud560 \uc218 \uc788\uc2b5\ub2c8\ub2e4.
janitor.help.decide.steps.2=\ubbf8\uc0ac\uc6a9\ubd80\ud130 \uc2dc\uc791\ud569\ub2c8\ub2e4. \uc704\ud5d8\uc774\ub098 \ud65c\uc131\ubd80\ud130 \uc190\ub300\uba74 \uc2dc\uac04\ub9cc \uc4f0\uace0 \uc5bb\ub294 \uac83\uc774 \uc5c6\uc2b5\ub2c8\ub2e4.
janitor.help.decide.steps.3=\uc9c0\uc6b8 \ud6c4\ubcf4\ub97c \uc815\ud558\uba74 \uc0c1\uc138 \ud654\uba74\uc744 \uc5f4\uc5b4 \ucc38\uc870\uac00 \uc815\ub9d0 0\uc778\uc9c0 \ub208\uc73c\ub85c \ud655\uc778\ud569\ub2c8\ub2e4. "\ud655\uc778 \ubd88\uac00" \ubaa9\ub85d\uc5d0 \uadf8 \ud544\ub4dc\uac00 \uc788\uc73c\uba74 \ud6c4\ubcf4\uc5d0\uc11c \ube7c\uc2ed\ub2c8\ub2e4.
janitor.help.decide.steps.4=\uc9c0\uc6b0\uae30 \uc804\uc5d0 DB \ubc31\uc5c5\uc774 \uc788\ub294\uc9c0 \ud655\uc778\ud569\ub2c8\ub2e4. \ucee4\uc2a4\ud140 \ud544\ub4dc \uc0ad\uc81c\ub294 Jira\uc5d0\uc11c \ub418\ub3cc\ub9b4 \uc218 \uc5c6\uc2b5\ub2c8\ub2e4.
janitor.help.decide.steps.5=Jira \ud45c\uc900 \ud654\uba74\uc5d0\uc11c \ud55c \ubc88\uc5d0 \uba87 \uac1c\uc529\ub9cc \uc9c0\uc6b0\uace0, \uadf8 \uc0ac\uc774 \uc774\uc288 \uc0dd\uc131\u00b7\ud3b8\uc9d1\uacfc \uc8fc\uc694 \uc6cc\ud06c\ud50c\ub85c \uc804\uc774\ub97c \uc2dc\ud5d8\ud574 \ubd05\ub2c8\ub2e4. \ud55c \ubc88\uc5d0 \uc218\uc2ed \uac1c\ub97c \uc9c0\uc6b0\uba74 \ubb34\uc5c7\uc774 \uc6d0\uc778\uc778\uc9c0 \ucc3e\uc744 \uc218 \uc5c6\uc2b5\ub2c8\ub2e4.
janitor.help.decide.steps.6=\uc9c0\uc6b4 \ub4a4 \ub2e4\uc2dc \uc2a4\uce94\ud574 "\ud655\uc778 \ubd88\uac00" \ubaa9\ub85d\uacfc \ub0a8\uc740 \ud544\ub4dc \uc218\ub97c \ud655\uc778\ud569\ub2c8\ub2e4. \ub2e4\uc74c \uc815\ub9ac \ub54c \uc774 \uae30\ub85d\uc774 \uc2dc\uc791\uc810\uc774 \ub429\ub2c8\ub2e4.
janitor.help.decide.orphanWarning=\ucee4\uc2a4\ud140 \ud544\ub4dc\ub97c \uc9c0\uc6b0\uba74 \uadf8 \ud544\ub4dc\uc758 \uac12\ub3c4 \ud568\uaed8 \uc601\uad6c\ud788 \uc0ad\uc81c\ub429\ub2c8\ub2e4. Jira\uc5d0\ub294 \ub418\ub3cc\ub9ac\uae30\uac00 \uc5c6\uc2b5\ub2c8\ub2e4. \ud2b9\ud788 \uace0\uc544 \ub370\uc774\ud130 \ub77c\ubca8\uc740 \ud654\uba74\uc5d0 \uc548 \ubcf4\uc778\ub2e4\ub294 \uc774\uc720\ub85c "\uc548 \uc4f0\ub294 \ud544\ub4dc"\ucc98\ub7fc \ubcf4\uc774\uc9c0\ub9cc \uc2e4\uc81c\ub85c\ub294 \ub370\uc774\ud130\uac00 \ub0a8\uc544 \uc788\ub294 \uc0c1\ud0dc\uc785\ub2c8\ub2e4.

# --- 6. \uc2a4\uce94 ---
janitor.help.scan.title=\uc2a4\uce94\uc774 \ub3d9\uc791\ud558\ub294 \ubc29\uc2dd
janitor.help.scan.body=\uc774 \ud654\uba74\uc758 \uc22b\uc790\ub294 \uc2e4\uc2dc\uac04 \uc870\ud68c\uac00 \uc544\ub2c8\ub77c \ub9c8\uc9c0\ub9c9 \uc2a4\uce94 \uacb0\uacfc\uc785\ub2c8\ub2e4. \uad00\ub9ac\uc790 \ub3c4\uad6c\ub294 \uc608\uce21 \uac00\ub2a5\ud55c \uac83\uc774 \uc2e4\uc2dc\uac04\ubcf4\ub2e4 \ub0ab\ub2e4\uace0 \ubcf4\uc544 \uadf8\ub807\uac8c \ub9cc\ub4e4\uc5c8\uc2b5\ub2c8\ub2e4.
janitor.help.scan.when.title=\uc5b8\uc81c \ub2e4\uc2dc \uc2a4\uce94\ud574\uc57c \ud558\ub098
