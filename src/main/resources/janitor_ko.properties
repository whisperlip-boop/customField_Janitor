janitor.help.scan.failed.body=\ub77c\ubca8 \ud310\uc815\uc5d0 \uc9c1\uc811 \uc4f0\uc774\ub294 \uc7ac\ub8cc\uac00 \uc2e4\ud328\ud558\uba74 \ubd80\ubd84 \uacb0\uacfc\ub97c \ub0b4\uc9c0 \uc54a\uace0 \uc2a4\uce94 \uc804\uccb4\uac00 \uc2e4\ud328\ud569\ub2c8\ub2e4. \uac12 \uc9d1\uacc4\uc640 \uc7a0\uae34 \ud544\ub4dc \uc870\ud68c\uac00 \uadf8\ub807\uc2b5\ub2c8\ub2e4. \uc774\uc720\ub294 \uadf8 \uc2e4\ud328\uac00 \ub77c\ubca8\uc744 \ube44\uc6b0\ub294 \uac8c \uc544\ub2c8\ub77c \uac70\uafb8\ub85c \ub9cc\ub4e4\uae30 \ub54c\ubb38\uc785\ub2c8\ub2e4 \u2014 \uac12\uc744 \ubabb \uc77d\uc73c\uba74 0\uc73c\ub85c \ub0a8\uc544 [\ubbf8\uc0ac\uc6a9], \uc989 "\uc0ad\uc81c \uc548\uc804"\uc73c\ub85c \ud45c\uc2dc\ub418\uace0 \ubaa9\ub85d \ub9e8 \uc704\uc5d0 \uc635\ub2c8\ub2e4. \uc2a4\uce94\uc774 \uc2e4\ud328\ud558\uba74 \uc774\uc804 \uacb0\uacfc\uac00 \uadf8\ub300\ub85c \ub0a8\uace0 \ud654\uba74 \uc704\uc5d0 \ube68\uac04 \uc2e4\ud328 \uc548\ub0b4\uac00 \ub098\uc635\ub2c8\ub2e4. \uadf8 \uc548\ub0b4\ub294 \uc0c8\ub85c\uace0\uce68\ud574\ub3c4 \uc0ac\ub77c\uc9c0\uc9c0 \uc54a\uc73c\uba70, \ud45c\uac00 \uc774\uc804 \uc2a4\uce94 \uac83\uc774\uba74 \uadf8 \uc0ac\uc2e4\uc744 \ud568\uaed8 \uc54c\ub9bd\ub2c8\ub2e4.
janitor.help.scan.deep.title=\uc2ec\uce35 \uc2a4\uce94
janitor.help.scan.deep.body=\uc124\uce58\ub41c \uc571\uc758 \ud14c\uc774\ube14(AO_*)\uc5d0\uc11c \ucee4\uc2a4\ud140 \ud544\ub4dc ID \ubb38\uc790\uc5f4\uc744 \ucc3e\uc2b5\ub2c8\ub2e4. \uc77c\ubc18 \uc2a4\uce94\uc740 Jira \uc790\uc2e0\uc758 \uc124\uc815\ub9cc \ubcf4\uae30 \ub54c\ubb38\uc5d0, \uc571\uc774 \uc790\uae30 \ud14c\uc774\ube14\uc5d0 \uc800\uc7a5\ud55c \uc0ac\uc6a9\uc740 \uc7a1\ud788\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4. \uc5ec\uae30\uc11c \ub098\uc624\ub294 \uac83\uc740 \ubb38\uc790\uc5f4 \uc77c\uce58\uc77c \ubfd0\uc774\uba70 \ucc38\uc870\uc778\uc9c0\ub294 \ud655\uc778\ud558\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4 \u2014 \uc0c1\ud0dc \ub77c\ubca8\uc5d0 \ubc18\uc601\ub418\uc9c0 \uc54a\uace0, \uc0c1\uc138 \ud654\uba74\uc5d0\uc11c\ub3c4 \ucc38\uc870 \ud45c\uc640 \ub530\ub85c \ubcf4\uc5ec\ub4dc\ub9bd\ub2c8\ub2e4. \uac10\uc0ac \ub85c\uadf8 \ud14c\uc774\ube14\uc740 \uc81c\uc678\ud569\ub2c8\ub2e4. \uac70\uae30 \uc788\ub294 \uac83\uc740 \ucc38\uc870\uac00 \uc544\ub2c8\ub77c "\uc608\uc804\uc5d0 \uc774 \ud544\ub4dc\ub97c \uc124\uc815\ud588\ub2e4"\ub294 \uc774\ub825\uc774\ub77c, \ud3ec\ud568\ud558\uba74 \ud55c \ubc88\uc774\ub77c\ub3c4 \uc124\uc815\ub41c \ubaa8\ub4e0 \ud544\ub4dc\uac00 \uac78\ub9bd\ub2c8\ub2e4. \uc571 \ud14c\uc774\ube14 \uc804\uccb4\ub97c \ud6d1\uae30 \ub54c\ubb38\uc5d0 \uc77c\ubc18 \uc2a4\uce94\ubcf4\ub2e4 \uc624\ub798 \uac78\ub9bd\ub2c8\ub2e4.

