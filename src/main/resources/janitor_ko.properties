janitor.help.faq.a5=\uc0c1\uc138 \ud654\uba74\uc5d0\uc11c "\ub3d9\uc791\uc774 \uae68\uc9d0" \ubc30\uc9c0\uac00 \ubd99\uc740 \ud56d\ubaa9\uc744 \ucc3e\uc544 \ub9c1\ud06c\ub97c \ub20c\ub7ec \uadf8 \ucc38\uc870\ub97c \uc81c\uac70\ud558\uc2ed\uc2dc\uc624. \uc6cc\ud06c\ud50c\ub85c\ub77c\uba74 \ud574\ub2f9 \uc804\uc774\uc758 \uc870\uac74\u00b7\uac80\uc99d\uae30\u00b7\ud6c4\ucc98\ub9ac \ud568\uc218\ub97c, \uc2a4\ud0b4\uc774\ub77c\uba74 \uadf8 \ud56d\ubaa9\uc744 \uc9c0\uc6b0\uba74 \ub429\ub2c8\ub2e4. \uadf8 \ub4a4 \ub2e4\uc2dc \uc2a4\uce94\ud558\uba74 \ub77c\ubca8\uc774 \ub0b4\ub824\uac11\ub2c8\ub2e4. \uc571\uc774 \uc7a0\uadfc \ud544\ub4dc\ub294 \uc774 \ubc29\ubc95\uc73c\ub85c \ub0b4\ub824\uac00\uc9c0 \uc54a\uace0, \ub0b4\ub824\uac00\uac8c \ub9cc\ub4e4\uc5b4\uc11c\ub3c4 \uc548 \ub429\ub2c8\ub2e4.
