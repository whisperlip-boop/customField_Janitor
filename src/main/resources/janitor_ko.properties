janitor.help.faq.q1=Jira \ucee4\uc2a4\ud140 \ud544\ub4dc \ud654\uba74\uc5d0\ub294 \uc5c6\ub294 \ud544\ub4dc\uac00 \uc774 \ubaa9\ub85d\uc5d0\ub294 \uc788\uc2b5\ub2c8\ub2e4.
janitor.help.faq.a1=\ud0c0\uc785\uc744 \uc81c\uacf5\ud558\ub294 \uc571\uc774 \ube44\ud65c\uc131\uc774\uba74 Jira\ub294 \uadf8 \ud544\ub4dc\ub97c \ubaa9\ub85d\uc5d0\uc11c \uc228\uae41\ub2c8\ub2e4. \uc774 \ub3c4\uad6c\ub294 DB\ub97c \uae30\uc900\uc73c\ub85c \ud558\ubbc0\ub85c \uadf8 \ud544\ub4dc\ub3c4 \ubcf4\uc5ec\uc90d\ub2c8\ub2e4. "\ud0c0\uc785 \uc5c6\uc74c" \ud45c\uc2dc\uac00 \ubd99\uc740 \uac83\ub4e4\uc774 \uadf8\ub7f0 \uacbd\uc6b0\uc774\uace0, \uc571\uc744 \uc9c0\uc6b4 \ub4a4 \ub0a8\uc740 \uc794\ud574\ub77c \ubcf4\ud1b5 \uc815\ub9ac \ub300\uc0c1 1\uc21c\uc704\uc785\ub2c8\ub2e4.
janitor.help.faq.q2=Sprint\ub098 Story Points \uac19\uc740 Jira \uae30\ubcf8 \ud544\ub4dc\uac00 \uc65c \ubaa9\ub85d\uc5d0 \ub098\uc624\ub098\uc694?
janitor.help.faq.a2=\uadf8 \ud544\ub4dc\ub4e4\uc740 \uae30\ubcf8 \ud544\ub4dc\uac00 \uc544\ub2c8\ub77c Jira Software \uc571\uc774 \ub9cc\ub4e0 \ucee4\uc2a4\ud140 \ud544\ub4dc\uc785\ub2c8\ub2e4. \uc9c4\uc9dc \uae30\ubcf8 \ud544\ub4dc(\uc694\uc57d, \ub2f4\ub2f9\uc790, \uc6b0\uc120\uc21c\uc704, \uc0c1\ud0dc \ub4f1)\ub294 \uc774 \ubaa9\ub85d\uc5d0 \ub098\uc62c \uc218 \uc5c6\uc2b5\ub2c8\ub2e4. Sprint\ub098 Epic Link\ucc98\ub7fc \uc571\uc774 \uc7a0\uadfc \uac83\ub4e4\uc740 \uc704\ud5d8 \ub77c\ubca8\uacfc \uc7a0\uae40 \ud45c\uc2dc\uac00 \ud568\uaed8 \ubd99\uc2b5\ub2c8\ub2e4.
janitor.help.faq.q3=\uac12\uc774 \uc788\ub294 \uac83\uc744 \uc544\ub294\ub370 \uac12 \uc788\ub294 \uc774\uc288 \uc218\uac00 0\uc73c\ub85c \ub098\uc635\ub2c8\ub2e4.
janitor.help.faq.a3=\uac12\uc744 \uc571 \uc790\uccb4 \ud14c\uc774\ube14\uc5d0 \uc800\uc7a5\ud558\ub294 \ud0c0\uc785(Rank \ub4f1)\uc774\uba74 \uc774 \ub3c4\uad6c\uc758 \uc9d1\uacc4\uc5d0 \uc7a1\ud788\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4. \uadf8\ub7f0 \ud544\ub4dc\ub294 \ub300\uac1c \uc7a0\uae40 \ud45c\uc2dc\uac00 \ud568\uaed8 \uc788\uc73c\ub2c8 \uadf8 \ud45c\uc2dc\ub97c \uba3c\uc800 \ubcf4\uc2ed\uc2dc\uc624. \uc7a0\uae40\ub3c4 \uc544\ub2c8\uace0 \ud0c0\uc785 \uc5c6\uc74c\ub3c4 \uc544\ub2cc\ub370 0\uc774\ub77c\uba74 "\ud655\uc778 \ubd88\uac00" \ubaa9\ub85d\uc744 \ud655\uc778\ud558\uc2ed\uc2dc\uc624.
janitor.help.faq.q4=\uac19\uc740 \uc774\ub984\uc758 \ud544\ub4dc\uac00 \uc5ec\ub7ec \uac1c\uc778\ub370 \ubb34\uc5c7\uc744 \uc9c0\uc6cc\uc57c \ud560\uc9c0 \ubaa8\ub974\uaca0\uc2b5\ub2c8\ub2e4.
janitor.help.faq.a4=\ubaa9\ub85d\uc5d0\uc11c \uac01 \ud589\uc758 \uac12 \uc788\ub294 \uc774\uc288 \uc218\uc640 \ud654\uba74 \uc218\ub97c \ube44\uad50\ud558\uc2ed\uc2dc\uc624. \ubcf4\ud1b5 \ud558\ub098\ub9cc \uac12\uacfc \ud654\uba74\uc744 \uac16\uace0 \ub098\uba38\uc9c0\ub294 0\uc785\ub2c8\ub2e4. \uadf8 0\uc778 \uac83\ub4e4\uc774 \ud6c4\ubcf4\uc785\ub2c8\ub2e4. \uc0ad\uc81c\ud560 \ub54c\ub294 \ubc18\ub4dc\uc2dc \ud544\ub4dc ID\ub85c \ub300\uc0c1\uc744 \ud655\uc778\ud558\uc2ed\uc2dc\uc624 \u2014 \uc0ad\uc81c \ud654\uba74\uc5d0\uc11c \uc774\ub984\ub9cc \ubcf4\uace0 \uace0\ub974\uba74 \uc5c9\ub6b1\ud55c \uac83\uc744 \uc9c0\uc6c1\ub2c8\ub2e4.
