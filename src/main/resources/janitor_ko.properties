janitor.help.scan.inject.body=\uad00\ub9ac > \uc774\uc288 > \ucee4\uc2a4\ud140 \ud544\ub4dc \ud654\uba74\uc758 \uac01 \ud589\uc5d0\ub3c4 \uc0c1\ud0dc \ubc30\uc9c0\uc640 \uac12 \uac74\uc218, \uc0ac\uc6a9\ucc98 \ub9c1\ud06c\uac00 \ubd99\uc2b5\ub2c8\ub2e4. \ud544\ub4dc\ub97c \ubcf4\ub2e4\uac00 \uad81\uae08\ud574\uc9c4 \uc790\ub9ac\uc5d0\uc11c \ubc14\ub85c \ub118\uc5b4\uc62c \uc218 \uc788\uac8c \ud55c \uac83\uc785\ub2c8\ub2e4. \uc2a4\uce94\ud55c \uc801\uc774 \uc5c6\uc73c\uba74 \uc544\ubb34\uac83\ub3c4 \ubd99\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4.
janitor.help.scan.problems.title=\ud655\uc778 \ubd88\uac00 \ubaa9\ub85d
janitor.help.scan.problems.body=\ubaa9\ub85d \ud654\uba74 \ub9e8 \uc544\ub798\uc5d0 \ub098\uc635\ub2c8\ub2e4. \uc2a4\uce94\uc774 \uc77d\uc9c0 \ubabb\ud55c \ud56d\ubaa9\uc785\ub2c8\ub2e4(\uc608: JQL \ud30c\uc2f1\uc774 \uc548 \ub418\ub294 \uae68\uc9c4 \ud544\ud130). \uc5ec\uae30\uc5d0 \uc62c\ub77c\uc628 \uac83\uc740 "\ucc38\uc870 \uc5c6\uc74c"\uc774 \uc544\ub2c8\ub77c "\ubaa8\ub984"\uc785\ub2c8\ub2e4. \uc9c0\uc6b8 \ud6c4\ubcf4\uc5d0 \uc788\ub294 \ud544\ub4dc\uac00 \uc774 \ubaa9\ub85d\uacfc \uad00\ub828\ub418\uc5b4 \uc788\uc73c\uba74 \ud6c4\ubcf4\uc5d0\uc11c \ube7c\uc2ed\uc2dc\uc624. \ub2e8 \ub77c\ubca8 \ud310\uc815\uc744 \ub4a4\uc9d1\ub294 \uc7ac\ub8cc(\uac12 \uc9d1\uacc4, \uc7a0\uae34 \ud544\ub4dc)\uac00 \uc2e4\ud328\ud558\uba74 \uc774 \ubaa9\ub85d\uc5d0 \ub2f4\uc9c0 \uc54a\uace0 \uc2a4\uce94 \uc790\uccb4\uac00 \uc2e4\ud328\ud569\ub2c8\ub2e4 \u2014 \uc544\ub798 \ud56d\ubaa9\uc744 \ubcf4\uc2ed\uc2dc\uc624.

# --- 7. \ud55c\uacc4 ---
janitor.help.limits.title=\uc774 \ub3c4\uad6c\uac00 \ubcf4\uc9c0 \ubabb\ud558\ub294 \uac83
janitor.help.limits.body=\ucc38\uc870\uac00 0\uc73c\ub85c \ub098\uc654\ub2e4\uace0 \ud574\uc11c \uc0ad\uc81c\ud574\ub3c4 \uc548\uc804\ud558\ub2e4\ub294 \uc99d\uba85\uc740 \uc544\ub2d9\ub2c8\ub2e4. \uc704 \ubb38\uad6c\uc5d0 \uc801\ud78c \ubc94\uc704\ub294 \ud655\uc778\ub418\uc9c0 \uc54a\uc558\uc2b5\ub2c8\ub2e4. \ub3c4\uad6c\uac00 \uc790\uae30 \ud55c\uacc4\ub97c \ub9d0\ud558\uc9c0 \uc54a\uc73c\uba74 \uad00\ub9ac\uc790\uac00 \uc798\ubabb\ub41c \ud655\uc2e0\uc73c\ub85c \ud544\ub4dc\ub97c \uc9c0\uc6b0\uae30 \ub54c\ubb38\uc5d0 \ud654\uba74\uacfc \uc774 \ubb38\uc11c\uc5d0 \uac19\uc740 \ub0b4\uc6a9\uc744 \uc801\uc5b4 \ub450\uc5c8\uc2b5\ub2c8\ub2e4. \ub9c8\uc9c0\ub9c9 \uac12 \ubcc0\uacbd\uc77c\ub3c4 \ud544\ub4dc \uc774\ub984 \uae30\ubc18\uc774\ub77c \uc774\ub984\uc774 \ubc14\ub00c\uc5c8\uac70\ub098 \uc911\ubcf5\ub41c \ud544\ub4dc\uc5d0\uc11c\ub294 \ubd80\uc815\ud655\ud569\ub2c8\ub2e4.

# --- 8. \uc790\uc8fc \uacaa\ub294 \uc0c1\ud669 ---
