janitor.help.scan.csv.body=\ud654\uba74\uc5d0 \ubcf4\uc774\ub294 \ubaa8\ub4e0 \uceec\ub7fc\uc5d0 \uad8c\ud55c\u00b7\uc54c\ub9bc\u00b7\uc774\uc288 \ubcf4\uc548 \uc2a4\ud0b4 \ucc38\uc870 \uc218\uc640 \uc7a0\uae40 \uc5ec\ubd80\uae4c\uc9c0 \ub354\ud574 \ub0b4\ubcf4\ub0c5\ub2c8\ub2e4. \uc2a4\ud504\ub808\ub4dc\uc2dc\ud2b8\uc5d0\uc11c \uc815\ub9ac \uacc4\ud68d\uc744 \uc138\uc6b0\uac70\ub098 \uad00\ub828 \ud300\uc5d0 \ub3cc\ub9b4 \ub54c \uc4f0\uc2ed\uc2dc\uc624. Excel\uc5d0\uc11c \ubc14\ub85c \uc5f4\ub9ac\ub3c4\ub85d \uc778\ucf54\ub529\uc744 \ub9de\ucdb0 \ub450\uc5c8\uc2b5\ub2c8\ub2e4.
