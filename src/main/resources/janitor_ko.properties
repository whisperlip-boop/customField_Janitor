janitor.help.columns.field=\ud544\ub4dc \uc774\ub984\uacfc \uadf8 \uc544\ub798 \ud544\ub4dc ID\uc785\ub2c8\ub2e4. \uc774 \ub3c4\uad6c\uc758 \ubaa8\ub4e0 \ud310\ub2e8\uc740 \uc774\ub984\uc774 \uc544\ub2c8\ub77c ID \uae30\uc900\uc785\ub2c8\ub2e4 \u2014 \uc815\ub9ac\uac00 \ud544\uc694\ud55c \uc778\uc2a4\ud134\uc2a4\uc5d0\ub294 \uac19\uc740 \uc774\ub984\uc758 \ud544\ub4dc\uac00 \uc5ec\ub7ec \uac1c \uc788\ub294 \uac83\uc774 \uc815\uc0c1\uc774\uace0, \uc774\ub984\uc73c\ub85c \ud310\ub2e8\ud558\uba74 \uc5c9\ub6b1\ud55c \ud544\ub4dc\ub97c \uc9c0\uc6c1\ub2c8\ub2e4. \uc774\ub984\uc744 \ud074\ub9ad\ud558\uba74 \uadf8 \ud544\ub4dc\uc758 \uc0c1\uc138 \ud654\uba74\uc73c\ub85c \uac11\ub2c8\ub2e4. \uc774\ub984 \uc606\uc5d0 \ubd99\ub294 \ud45c\uc2dc\ub294 3\uc7a5\uc5d0\uc11c \uc124\uba85\ud569\ub2c8\ub2e4.
janitor.help.columns.type=\ud544\ub4dc \ud0c0\uc785\uc785\ub2c8\ub2e4. \ud0c0\uc785\uc744 \uc81c\uacf5\ud558\ub294 \uc571\uc774 \ube44\ud65c\uc131\uc774\uba74 \uc0ac\ub78c\uc774 \uc77d\uc744 \uc218 \uc788\ub294 \uc774\ub984\uc774 \uc5c6\uc5b4\uc11c \ud0c0\uc785 \ud0a4\uac00 \uadf8\ub300\ub85c \ub098\uc635\ub2c8\ub2e4(\uc608: com.pyxis.greenhopper.jira:gh-sprint). \uadf8 \uacbd\uc6b0 \uc544\ub798\uc5d0 "\ud0c0\uc785 \uc5c6\uc74c" \ud45c\uc2dc\uac00 \ubd99\uc2b5\ub2c8\ub2e4.
janitor.help.columns.issuesWithValue=\uc774 \ud544\ub4dc\uc5d0 \uac12\uc774 \ub4e4\uc5b4 \uc788\ub294 \uc774\uc288\uc758 \uac1c\uc218\uc785\ub2c8\ub2e4. \uc11c\ub85c \ub2e4\ub978 \uc774\uc288\uc758 \uc218\uc774\ubbc0\ub85c \uc774\uc288 \ud558\ub098\uc5d0 \uac12\uc774 \uc5ec\ub7ec \uac1c\uc5ec\ub3c4 1\ub85c \uc149\ub2c8\ub2e4. \uc774 \uc22b\uc790\uac00 \uc774 \ub3c4\uad6c\uc758 \uc8fc \uc9c0\ud45c\uc785\ub2c8\ub2e4 \u2014 Jira \uae30\ubcf8 \uad00\ub9ac \ud654\uba74\uc774 \uc54c\ub824\uc8fc\uc9c0 \uc54a\ub294 \uac12\uc785\ub2c8\ub2e4.
janitor.help.columns.valueRows=\uc800\uc7a5\ub41c \uac12 \ud589\uc758 \uac1c\uc218\uc785\ub2c8\ub2e4. \ub2e4\uc911 \uc120\ud0dd\uc774\ub098 \uba40\ud2f0 \uc0ac\uc6a9\uc790 \ud544\ub4dc\ub294 \uc774\uc288 \ud558\ub098\uac00 \uc5ec\ub7ec \ud589\uc744 \ub9cc\ub4e4\uae30 \ub54c\ubb38\uc5d0 "\uac12 \uc788\ub294 \uc774\uc288 \uc218"\ubcf4\ub2e4 \ud07d\ub2c8\ub2e4. \ub450 \uc22b\uc790\uac00 \ub2e4\ub974\ub2e4\uace0 \uc624\ub958\uac00 \uc544\ub2d9\ub2c8\ub2e4. \uaddc\ubaa8\ub97c \ubcfc \ub54c\ub294 \uc774\uc288 \uc218\ub97c, \ub370\uc774\ud130 \uc591\uc744 \ubcfc \ub54c\ub294 \ud589 \uc218\ub97c \ubcf4\uc2ed\ub2c8\ub2e4.
janitor.help.columns.lastChange=\uc774 \ud544\ub4dc \uac12\uc774 \ub9c8\uc9c0\ub9c9\uc73c\ub85c \ubc14\ub010 \ub0a0\uc9dc\uc785\ub2c8\ub2e4. \ubcf4\uc870 \uc9c0\ud45c\uc785\ub2c8\ub2e4. Jira\ub294 \ubcc0\uacbd \uc774\ub825\uc5d0 \ud544\ub4dc ID\uac00 \uc544\ub2c8\ub77c \uadf8\ub54c\uc758 \ud544\ub4dc \uc774\ub984\uc744 \uc800\uc7a5\ud558\uae30 \ub54c\ubb38\uc5d0, \uc774\ub984\uc774 \uc911\ubcf5\ub41c \ud544\ub4dc\ub294 \uc774\ub825\uc774 \uc11e\uc5ec \uc2e0\ub8b0\ud560 \uc218 \uc5c6\uc2b5\ub2c8\ub2e4. \uadf8\ub7f0 \uacbd\uc6b0 \ub0a0\uc9dc \ub300\uc2e0 "\ubd80\uc815\ud655"\uc774\ub77c\uace0 \ud45c\uc2dc\ud558\uace0 \uac12\uc744 \ubd99\uc774\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4.
janitor.help.columns.screens=\uc774 \ud544\ub4dc\uac00 \ub193\uc778 \ud654\uba74\uc758 \uac1c\uc218\uc785\ub2c8\ub2e4. \ud654\uba74\uc5d0 \uc5c6\uc73c\uba74 \uc0ac\uc6a9\uc790\uac00 \uac12\uc744 \uc785\ub825\ud560 \uc218\ub3c4, \uc774\uc288\uc5d0\uc11c \ubcfc \uc218\ub3c4 \uc5c6\uc2b5\ub2c8\ub2e4. \uc0c1\ud0dc \ud310\uc815\uc5d0\uc11c \ud2b9\ubcc4\ud55c \ubb34\uac8c\ub97c \uac16\ub294 \uc22b\uc790\uc785\ub2c8\ub2e4.
janitor.help.columns.workflows=\uc6cc\ud06c\ud50c\ub85c\uc5d0\uc11c \uc774 \ud544\ub4dc\ub97c \ucc38\uc870\ud558\ub294 \uac74\uc218\uc785\ub2c8\ub2e4. \uc804\uc774 \ud654\uba74, \uc870\uac74, \uac80\uc99d\uae30, \uc804\u00b7\ud6c4\ucc98\ub9ac \ud568\uc218\ub97c \ubaa8\ub450 \uc149\ub2c8\ub2e4. \uac19\uc740 \ud544\ub4dc\uac00 \uc5ec\ub7ec \uc804\uc774\uc5d0\uc11c \uc4f0\uc774\uba74 \uadf8\ub9cc\ud07c \ub298\uc5b4\ub0a9\ub2c8\ub2e4.
janitor.help.columns.filters=\uc774 \ud544\ub4dc\ub97c \ucc38\uc870\ud558\ub294 \uc800\uc7a5\ub41c \uac80\uc0c9(\ud544\ud130)\uc758 \uac1c\uc218\uc785\ub2c8\ub2e4. JQL\uc5d0\uc11c \ud544\ub4dc \uc774\ub984\uc73c\ub85c \uc4f4 \uacbd\uc6b0\uc640 cf[ID]\ub85c \uc4f4 \uacbd\uc6b0\ub97c \ubaa8\ub450 \uc149\ub2c8\ub2e4.
janitor.help.columns.gadgets=\uc774 \ud544\ub4dc\ub97c \uc124\uc815\uc5d0 \ub2f4\uace0 \uc788\ub294 \ub300\uc2dc\ubcf4\ub4dc \uac00\uc82f\uc758 \uac1c\uc218\uc785\ub2c8\ub2e4.
janitor.help.columns.totalReferences=\uc704\uc758 \ubaa8\ub4e0 \ucc38\uc870 \uc885\ub958\ub97c \ud569\ud55c \uc218\uc785\ub2c8\ub2e4. \ud544\ub4dc \uc124\uc815\uacfc \ucee8\ud14d\uc2a4\ud2b8\uae4c\uc9c0 \ud3ec\ud568\ud558\ubbc0\ub85c \uc0c1\ud0dc \ud310\uc815\uc5d0 \uc4f0\uc774\ub294 \uc218\uc640\ub294 \ub2e4\ub985\ub2c8\ub2e4(2\uc7a5 \ucc38\uace0).
janitor.help.columns.sortNote=\uceec\ub7fc \uc81c\ubaa9\uc744 \ud074\ub9ad\ud558\uba74 \uc815\ub82c\ub429\ub2c8\ub2e4. \uae30\ubcf8 \uc815\ub82c\uc740 \uccad\uc18c \ub300\uc0c1\uc774 \uc704\ub85c \uc624\ub294 \uc21c\uc11c(\ubbf8\uc0ac\uc6a9 \u2192 \ubc29\uce58 \u2192 \uace0\uc544 \ub370\uc774\ud130 \u2192 \ud65c\uc131 \u2192 \uc704\ud5d8)\uc785\ub2c8\ub2e4. \uc704\ucabd\ubd80\ud130 \ud6d1\uc5b4 \ub0b4\ub824\uac00\uc2dc\uba74 \ub429\ub2c8\ub2e4. \uac80\uc0c9\ucc3d\uc740 \ud544\ub4dc \uc774\ub984\uacfc \ud544\ub4dc ID\ub97c \ud568\uaed8 \ucc3e\uc2b5\ub2c8\ub2e4.

# --- 2. \uc0c1\ud0dc \ub77c\ubca8 ---
janitor.help.status.title=\uc0c1\ud0dc \ub77c\ubca8
janitor.help.status.intro=\ub77c\ubca8\uc740 \ub2e4\uc12f \uac1c\ubfd0\uc774\uace0 \ub298\ub9ac\uc9c0 \uc54a\uc2b5\ub2c8\ub2e4. \uc544\ub798 \uc21c\uc11c\ub300\ub85c \uc704\uc5d0\uc11c\ubd80\ud130 \uac80\uc0ac\ud574 \uba3c\uc800 \uac78\ub9ac\ub294 \uac83\uc73c\ub85c \uc815\ud569\ub2c8\ub2e4.
